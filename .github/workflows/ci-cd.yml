name: CI & Cloudflare Deploy

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install ".[dev]"
      - run: pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run Alembic migrations on Neon Postgres
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install ".[dev]"
          alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Angular & Typecheck Worker
        run: |
          npm ci
          cd frontend && npm ci && npx ng build && cd ..
          npx tsc -p tsconfig.worker.json

      - name: Deploy Worker, Static Assets & Container to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
